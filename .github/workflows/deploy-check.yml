name: 部署檢查

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-deployment:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 設定Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安裝依賴
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 檢查檔案
      run: |
        echo "檢查必要檔案..."
        test -f discord_bot_monitor.py && echo "✅ discord_bot_monitor.py" || echo "❌ 缺少 discord_bot_monitor.py"
        test -f web_monitor.py && echo "✅ web_monitor.py" || echo "❌ 缺少 web_monitor.py"
        test -f monitor_config.json && echo "✅ monitor_config.json" || echo "❌ 缺少 monitor_config.json"
        test -f Dockerfile.monitor && echo "✅ Dockerfile.monitor" || echo "❌ 缺少 Dockerfile.monitor"
    
    - name: 驗證Python語法
      run: |
        python -m py_compile discord_bot_monitor.py
        python -m py_compile web_monitor.py
        python -m py_compile discord_notifier.py
    
    - name: 驗證JSON配置
      run: |
        python -c "import json; json.load(open('monitor_config.json'))"
        echo "✅ 配置檔有效"
    
    - name: 部署檢查
      run: |
        python check_deployment_ready.py
